<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <title>Plan an order · Datafab AGX</title>
    <link rel="stylesheet" href="order-tool.css">
    <link rel="stylesheet" href="nav.css">
  </head>
  <body>
    <nav class="site-nav" aria-label="Primary">
      <a class="site-nav__brand" href="/">
        <img class="site-nav__logo" src="logo.png" alt="Datafab AGX">
        <span class="site-nav__brand-text">Datafab AGX</span>
        <span class="site-nav__collab" aria-hidden="true">×</span>
        <img class="site-nav__partner" src="hall-pickles-logo.png" alt="in partnership with Hall &amp; Pickles" width="148" height="26">
      </a>
      <div class="site-nav__links">
        <a class="site-nav__link" href="the-plan.html">The plan</a>
        <a class="site-nav__link" href="quota-tracker.html">Live quotas</a>
        <a class="site-nav__link" href="deployment-ideas.html">Deployment ideas</a>
        <a class="site-nav__link is-active" href="orders.html" aria-current="page">Orders</a>
      </div>
    </nav>

    <div class="app-layout">
      <aside class="sidebar" data-active="plan"></aside>
      <script src="app-sidebar.js"></script>
      <main class="page intel-page plan-page">
        <div class="page-head">
          <div>
            <p class="eyebrow">Orders</p>
            <h1>Plan an order</h1>
          </div>
        </div>

        <form class="plan-bar card bk-bar" id="plan-form" novalidate aria-label="Order settings">
          <div class="pf pf-appetite">
            <span class="pf-label" id="pf-appetite-label">Approach</span>
            <div class="seg pf-seg" id="pf-appetite" role="radiogroup" aria-labelledby="pf-appetite-label"></div>
          </div>
          <div class="pf pf-cbam">
            <span class="pf-label" id="pf-cbam-label">UK CBAM</span>
            <button type="button" class="pf-control pf-switch" id="pf-cbam" role="switch" aria-checked="false" aria-labelledby="pf-cbam-label"><span class="cbam-track" aria-hidden="true"><span class="cbam-thumb"></span></span><span class="pf-switch-text">Off</span></button>
          </div>
        </form>

        <p class="asm-strip" id="asm-strip" hidden></p>

        <div class="bk">
          <section class="card bk-pick" aria-labelledby="bk-pick-title">
            <header class="bk-pick-head">
              <h2 id="bk-pick-title">Products</h2>
              <div class="bk-quick" role="group" aria-label="Select">
                <button type="button" data-pick="need">Needs ordering</button>
                <button type="button" data-pick="all">All</button>
                <button type="button" data-pick="none">Clear</button>
              </div>
            </header>
            <ul class="bk-list" id="bk-list"><li class="muted">Loading…</li></ul>
            <footer class="bk-total" id="bk-total"></footer>
          </section>
          <div class="bk-out" id="plan"><div class="pulse-empty"><span class="spinner sm" aria-hidden="true"></span><span>Loading…</span></div></div>
        </div>
      </main>
    </div>

    <script src="order-common.js"></script>
    <script src="plan.js"></script>
    <script src="nav-menu.js"></script>
  </body>
</html>
